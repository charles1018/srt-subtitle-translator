[package]
name = "srt-translator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "SRT Subtitle Translator（Rust 移植版）"
license = "MIT"
publish = false

[[bin]]
name = "srt-translator-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chardetng = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
csv = "1.4.0"
dotenvy = "0.15.7"
encoding_rs = "0.8"
fancy-regex = "0.14"
futures = "0.3.34"
indexmap = { version = "2", features = ["serde"] }
log = "0.4.34"
md-5 = "0.11.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
flate2 = "1.1.10"
tempfile = "3"
wiremock = "0.6.5"
