[package]
name = "srt-translator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "SRT Subtitle Translator（Rust 移植版）"
license = "MIT"
publish = false

[[bin]]
name = "srt-translator-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chardetng = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
fancy-regex = "0.14"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
