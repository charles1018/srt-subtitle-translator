# Git pre-commit hooks（安裝：uv run pre-commit install）
# 使用 local hook 經 uv 執行，ruff 版本與 uv.lock / CI 一致
repos:
  - repo: local
    hooks:
      # 先 lint 修正再排版（--fix 可能產生需要重新排版的程式碼）
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true
